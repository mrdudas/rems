# Unit and integration tests on GitHub Actions for the epkeb branch and the
# epkeb-* feature branches.
# Upstream REMS runs its tests on CircleCI (.circleci/config.yml); this mirrors
# its unit-test and integration-test jobs.
name: test

on:
  push:
    branches: [epkeb, 'epkeb-*']
  pull_request:
    branches: [epkeb]
  workflow_dispatch:

env:
  LEIN_ROOT: "true"
  JVM_OPTS: -Xmx3200m

jobs:
  unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: DeLaGuardo/setup-clojure@13.4
        with:
          lein: 2.11.2
      - uses: actions/cache@v4
        with:
          path: ~/.m2
          key: m2-${{ hashFiles('project.clj') }}
          restore-keys: m2-
      # verify that we can run unit tests without the database
      - run: DATABASE_URL=invalid lein kaocha --reporter kaocha.report/documentation unit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results
          path: target/test-results

  integration-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_USER: rems_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: DeLaGuardo/setup-clojure@13.4
        with:
          lein: 2.11.2
      - uses: actions/cache@v4
        with:
          path: ~/.m2
          key: m2-${{ hashFiles('project.clj') }}
          restore-keys: m2-
      - run: lein kaocha --reporter kaocha.report/documentation integration
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-test-results
          path: target/test-results
