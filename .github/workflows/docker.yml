# Builds the EPKEB Docker image (Dockerfile.epkeb) and publishes it to the
# GitHub container registry, so that the test server only needs to pull it.
# Feature branches (epkeb-*) are only built, which checks that the frontend
# compiles. See docs/epkeb/telepites.md
name: docker

on:
  push:
    branches: [epkeb, 'epkeb-*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # the uberjar takes its version from `git describe`
          fetch-depth: 0
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.ref == 'refs/heads/epkeb'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.epkeb
          push: ${{ github.ref == 'refs/heads/epkeb' }}
          tags: |
            ghcr.io/${{ github.repository }}:epkeb
            ghcr.io/${{ github.repository }}:epkeb-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
